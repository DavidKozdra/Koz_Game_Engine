<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link id="appFavicon" rel="icon" type="image/png" href="logo.png">
  <title>Game Name HERE</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/p5.js"></script>
  <script src="preload.js"></script>
  <script src="Koz_Engine_Lib/Core/koz-engine.global.js" defer></script>
  <!-- Main game & UI -->
  <script src="game.js" defer></script>
  <script src="ui.js" defer></script>

  <link rel="stylesheet" href="style.css">
  <script>
    (function ensureFavicon() {
      const pngHref = "logo.png";
      const fallbackSvg =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111a24'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' font-size='34' font-family='Arial' fill='%23d4af37'%3EBQ%3C/text%3E%3C/svg%3E";

      function setIcon(href, type) {
        let link = document.getElementById("appFavicon");
        if (!link) {
          link = document.createElement("link");
          link.id = "appFavicon";
          link.rel = "icon";
          document.head.appendChild(link);
        }
        link.type = type;
        link.href = href;
      }

      const probe = new Image();
      probe.onload = function () { setIcon(pngHref, "image/png"); };
      probe.onerror = function () { setIcon(fallbackSvg, "image/svg+xml"); };
      probe.src = pngHref;
    })();
  </script>
</head>
